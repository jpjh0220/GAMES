<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050706"><title>Sol Live</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;margin:0;background:#050706;color:#edf7f1;font:13px system-ui,-apple-system,Segoe UI,sans-serif}body{display:flex;flex-direction:column}.bar{height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 13px;background:#09110e;border-bottom:1px solid #22332a}.brand{display:flex;gap:9px;align-items:center;font-weight:800;letter-spacing:.12em}.sigil{width:30px;height:30px;border:1px solid #315040;border-radius:9px;display:grid;place-items:center;color:#72f2ad}.state{color:#71867b;font-size:11px}.state.live{color:#72f2ad}.frame{flex:1;min-height:0;position:relative}iframe{border:0;width:100%;height:100%;background:#050706}.waiting{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 40%,rgba(114,242,173,.06),transparent 28rem),#050706;color:#71867b}.waiting b{display:block;color:#edf7f1;font-size:17px;margin-bottom:5px}.pulse{width:28px;height:28px;border:2px solid #294738;border-top-color:#72f2ad;border-radius:50%;margin:0 auto 12px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="bar"><div class="brand"><span class="sigil">S</span><span>SOL LIVE</span></div><div id="state" class="state">Locating current runner…</div></div><div class="frame"><div id="waiting" class="waiting"><div><div class="pulse"></div><b>Connecting to Sol</b>Following the active runner automatically.</div></div><iframe id="viewer" title="Sol live spectator"></iframe></div><script>
const API='https://api.github.com/repos/jpjh0220/GAMES/contents/sol-watch/live.json?ref=main';
const f=document.getElementById('viewer'),s=document.getElementById('state'),w=document.getElementById('waiting');let current='',lastRun=0,locatorBusy=false;
async function readLocator(){const r=await fetch(API+'&t='+Date.now(),{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error('locator');const j=await r.json();const text=atob((j.content||'').replace(/\n/g,''));return JSON.parse(text)}
async function endpointHealthy(url){return Boolean(url)}
async function locate(){if(locatorBusy)return;locatorBusy=true;try{const j=await readLocator();const age=Date.now()-Date.parse(j.updatedAt||0);const next=typeof j.url==='string'?j.url.trim():'';const nextRun=Number(j.runNumber||0);if(next){if(next!==current||nextRun!==lastRun){current=next;lastRun=nextRun;f.src=next+(next.includes('?')?'&':'?')+'pages_session='+encodeURIComponent(String(nextRun));}w.style.display='none';s.textContent=age<12*60*1000?'LIVE • runner '+lastRun:'Runner handoff in progress…';s.className='state '+(age<12*60*1000?'live':'')}}catch(e){s.textContent=current?'Rechecking active runner…':'Waiting for spectator endpoint…'}finally{locatorBusy=false;setTimeout(locate,10000)}}locate();
</script></body></html>
