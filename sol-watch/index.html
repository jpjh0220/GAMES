<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watch Sol Live</title><style>html,body{height:100%;margin:0;background:#080b10;color:#eef4ff;font:14px system-ui,-apple-system,Segoe UI,sans-serif}body{display:flex;flex-direction:column}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:#10151d;border-bottom:1px solid #253041}.name{font-weight:700}.state{color:#8fa2bc}.live{color:#7ee787}.frame{flex:1;min-height:0;position:relative}iframe{border:0;width:100%;height:100%;background:#080b10}.waiting{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#8fa2bc}.waiting b{display:block;color:#eef4ff;font-size:18px;margin-bottom:6px}a{color:#66e3ff}</style></head><body><div class="bar"><div class="name">SOL LIVE</div><div id="state" class="state">Locating current runner…</div></div><div class="frame"><div id="waiting" class="waiting"><div><b>Connecting to Sol</b>The permanent viewer will automatically follow runner handoffs.</div></div><iframe id="viewer" title="Sol live spectator" allow="autoplay"></iframe></div><script>const RAW='https://raw.githubusercontent.com/jpjh0220/GAMES/main/sol-watch/live.json';const f=document.getElementById('viewer'),s=document.getElementById('state'),w=document.getElementById('waiting');let current='';async function locate(){try{const r=await fetch(RAW+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();if(j.url&&j.url!==current){current=j.url;f.src=current;w.style.display='none'}const age=Date.now()-Date.parse(j.updatedAt||0);s.textContent=age<12*60*1000?'LIVE • runner '+(j.runNumber||'?'):'Reconnecting to next runner…';s.className='state '+(age<12*60*1000?'live':'')}catch(e){s.textContent='Waiting for spectator endpoint…'}setTimeout(locate,5000)}locate();</script></body></html>
