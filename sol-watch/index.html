<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050706"><title>Sol Live</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;margin:0;background:#050706;color:#edf7f1;font:13px system-ui,-apple-system,Segoe UI,sans-serif}body{display:grid;place-items:center}.card{width:min(520px,calc(100% - 28px));border:1px solid #223b2d;border-radius:18px;padding:28px;background:radial-gradient(circle at 50% 0,rgba(114,242,173,.1),transparent 22rem),#09110e;box-shadow:0 28px 100px rgba(0,0,0,.45);text-align:center}.sigil{width:42px;height:42px;margin:0 auto 14px;border:1px solid #315040;border-radius:13px;display:grid;place-items:center;color:#72f2ad;font-weight:900;font-size:20px}.eyebrow{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#71867b;font-weight:800}.title{font-size:22px;font-weight:900;margin:5px 0 8px}.status{color:#72f2ad;margin-bottom:18px}.pulse{width:28px;height:28px;border:2px solid #294738;border-top-color:#72f2ad;border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}a{display:inline-block;color:#72f2ad;border:1px solid #315040;border-radius:999px;padding:9px 14px;text-decoration:none;font-weight:800}small{display:block;color:#71867b;margin-top:16px;line-height:1.5}</style></head><body><main class="card"><div class="sigil">S</div><div class="eyebrow">Sol live spectator</div><div class="title">Connecting to the active world</div><div id="status" class="status"><div class="pulse"></div>Resolving the current runner…</div><a id="open" href="#" hidden>Open live spectator</a><small>This page now opens the current spectator directly instead of nesting it in a cross-origin frame. Your game session is unaffected.</small></main><script>
const raw='https://raw.githubusercontent.com/jpjh0220/GAMES/main/sol-watch/live.json';const status=document.getElementById('status'),open=document.getElementById('open');
async function locate(){try{const r=await fetch(raw+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('locator '+r.status);const j=await r.json();if(!j.url)throw new Error('missing endpoint');const u=new URL(j.url);u.searchParams.set('pages_session',String(j.runNumber||0));open.href=u.href;open.hidden=false;status.innerHTML='Runner '+(j.runNumber||'—')+' found. Opening spectator…';location.replace(u.href)}catch(e){status.innerHTML='Unable to resolve the active runner right now.';open.hidden=false;open.textContent='Retry';open.href=location.href;setTimeout(locate,15000)}}locate();
</script></body></html>
