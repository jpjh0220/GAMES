<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Human Project — Open World Society</title>
<style>
:root{color-scheme:dark;--bg:#070b12;--panel:#111827;--muted:#94a3b8;--text:#e5edf7;--line:#263244;--good:#4ade80;--warn:#fbbf24;--bad:#fb7185;--accent:#60a5fa}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#17233a 0,#070b12 42%);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;justify-content:space-between;background:rgba(7,11,18,.88);backdrop-filter:blur(10px);position:sticky;top:0;z-index:3}
h1{font-size:18px;margin:0}header p{margin:2px 0 0;color:var(--muted);font-size:12px}.controls{display:flex;gap:8px;flex-wrap:wrap}button,select,input{border:1px solid var(--line);background:#0b1220;color:var(--text);border-radius:9px;padding:8px 11px}button{cursor:pointer;font-weight:650}button:hover{border-color:#64748b}.primary{background:#1d4ed8;border-color:#3b82f6}.danger{background:#451a24;border-color:#9f1239}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;padding:14px;max-width:1500px;margin:auto}.card{background:rgba(17,24,39,.92);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 14px 45px rgba(0,0,0,.22)}.card h2{font-size:13px;margin:0;padding:11px 13px;border-bottom:1px solid var(--line);letter-spacing:.06em;text-transform:uppercase;color:#cbd5e1}.world-wrap{position:relative;min-height:620px}.world{display:block;width:100%;height:620px;background:#0a111d}.hud{position:absolute;left:12px;top:12px;background:rgba(3,7,18,.82);border:1px solid var(--line);padding:8px 10px;border-radius:10px;font-size:12px;pointer-events:none}.side{display:grid;gap:14px;align-content:start}.agents{max-height:330px;overflow:auto}.agent{padding:11px 13px;border-bottom:1px solid var(--line)}.agent:last-child{border:0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.name{font-weight:750}.sub{font-size:12px;color:var(--muted)}.meter{height:5px;background:#263244;border-radius:99px;margin-top:6px;overflow:hidden}.meter>i{display:block;height:100%;background:linear-gradient(90deg,#fb7185,#fbbf24,#4ade80)}.log{height:275px;overflow:auto;padding:9px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}.entry{padding:5px 0;border-bottom:1px dashed #243044}.entry b{color:#93c5fd}.legend{display:flex;gap:11px;flex-wrap:wrap;padding:10px 13px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.status{padding:10px 13px;color:var(--muted);font-size:12px}.status strong{color:var(--text)}
@media(max-width:900px){main{grid-template-columns:1fr}.world-wrap,.world{min-height:480px;height:480px}.side{grid-template-columns:1fr 1fr}.log{height:300px}}@media(max-width:620px){header{align-items:flex-start;flex-direction:column}.side{grid-template-columns:1fr}.world-wrap,.world{height:410px;min-height:410px}}
</style>
</head>
<body>
<header><div><h1>Human Project: Open World Society</h1><p>Browser-native embodied agents with needs, memory, labor, trade, and relationships.</p></div><div class="controls"><button id="run" class="primary">Run</button><button id="step">Step</button><button id="reset" class="danger">Reset</button><select id="speed"><option value="750">1×</option><option value="250" selected>3×</option><option value="80">10×</option></select></div></header>
<main>
<section class="card world-wrap"><canvas id="world" class="world"></canvas><div class="hud" id="hud"></div><div class="legend"><span><i class="dot" style="background:#60a5fa"></i>water</span><span><i class="dot" style="background:#4ade80"></i>food</span><span><i class="dot" style="background:#f59e0b"></i>market</span><span><i class="dot" style="background:#c084fc"></i>work</span><span><i class="dot" style="background:#fb7185"></i>hazard</span></div></section>
<aside class="side"><section class="card"><h2>Agents</h2><div id="agents" class="agents"></div></section><section class="card"><h2>Event stream</h2><div id="log" class="log"></div><div class="status" id="status"></div></section></aside>
</main>
<script>
(() => {
'use strict';
const W=24,H=16,CELL=36, STORAGE='human-project-browser-v1';
const sites=[
 {id:'well',x:3,y:3,type:'water',label:'Well'}, {id:'orchard',x:18,y:3,type:'food',label:'Orchard',stock:18},
 {id:'market',x:11,y:8,type:'market',label:'Market',stock:16}, {id:'farm',x:4,y:13,type:'work',label:'Farm'},
 {id:'workshop',x:19,y:12,type:'work',label:'Workshop'}, {id:'hazard',x:13,y:4,type:'hazard',label:'Ravine'}
];
const defaults=[
 {id:'root',name:'Root',x:1,y:1,role:'explorer',color:'#38bdf8'},
 {id:'mara',name:'Mara',x:9,y:7,role:'farmer',color:'#f472b6'},
 {id:'sol',name:'Sol',x:17,y:11,role:'builder',color:'#facc15'}
];
let state, timer=null;
const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d');
const dpr=Math.max(1,devicePixelRatio||1);
function fresh(){return {tick:0,day:1,hour:8,agents:defaults.map((a,i)=>({...a,health:100,energy:78-i*5,hydration:74+i*4,social:52,credits:4+i*2,food:i===1?2:1,goal:'observe',memory:[],relations:{},last:'initialized'})),log:['World initialized.']};}
function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE));return x&&x.agents?x:fresh()}catch{return fresh()}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function dist(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)}
function nearest(agent,type){return sites.filter(s=>s.type===type).sort((a,b)=>dist(agent,a)-dist(agent,b))[0]}
function at(agent,site){return agent.x===site.x&&agent.y===site.y}
function moveToward(a,t){const dx=t.x-a.x,dy=t.y-a.y;if(Math.abs(dx)>Math.abs(dy))a.x+=Math.sign(dx);else if(dy)a.y+=Math.sign(dy);else if(dx)a.x+=Math.sign(dx);a.x=Math.max(0,Math.min(W-1,a.x));a.y=Math.max(0,Math.min(H-1,a.y));}
function remember(a,text,weight=.5){a.memory.push({tick:state.tick,text,weight});if(a.memory.length>30)a.memory.shift()}
function relation(a,b){return a.relations[b.id]||(a.relations[b.id]={trust:0,familiarity:0,debt:0})}
function decide(a){
 const danger=sites.find(s=>s.type==='hazard'&&dist(a,s)<=1); if(danger)return {kind:'avoid',target:danger};
 if(a.hydration<38)return {kind:'seek',target:nearest(a,'water'),need:'water'};
 if(a.energy<34){if(a.food>0)return {kind:'eat'};return {kind:'seek',target:nearest(a,'food'),need:'food'};}
 if(a.credits<3)return {kind:'seek',target:nearest(a,'work'),need:'work'};
 const nearby=state.agents.filter(b=>b.id!==a.id&&dist(a,b)<=1); if(a.social<38&&nearby.length)return {kind:'talk',target:nearby[0]};
 if(a.food>2&&nearby.some(b=>b.food===0))return {kind:'give',target:nearby.find(b=>b.food===0)};
 if(Math.random()<.36)return {kind:'seek',target:sites[Math.floor(Math.random()*sites.length)],need:'explore'};
 return {kind:'wander'};
}
function act(a,d){let text='';a.goal=d.need||d.kind;
 if(d.kind==='avoid'){a.x+=a.x<=d.target.x?-1:1;a.x=Math.max(0,Math.min(W-1,a.x));text=`avoided ${d.target.label}`;}
 else if(d.kind==='seek'){if(at(a,d.target)){if(d.need==='water'){a.hydration=Math.min(100,a.hydration+48);text='drank from the well';}
   else if(d.need==='food'){if(d.target.stock>0){d.target.stock--;a.food++;text='gathered food';}else text='found no food';}
   else if(d.need==='work'){a.energy-=8;a.credits+=2;nearest(a,'market').stock++;text=`worked at ${d.target.label} and earned 2 credits`;}
   else text=`observed ${d.target.label}`;
  }else{moveToward(a,d.target);text=`traveled toward ${d.target.label}`;}}
 else if(d.kind==='eat'){a.food--;a.energy=Math.min(100,a.energy+45);text='ate stored food';}
 else if(d.kind==='talk'){const r1=relation(a,d.target),r2=relation(d.target,a);r1.trust+=.05;r1.familiarity++;r2.trust+=.03;r2.familiarity++;a.social=Math.min(100,a.social+24);d.target.social=Math.min(100,d.target.social+8);text=`spoke with ${d.target.name}`;}
 else if(d.kind==='give'){a.food--;d.target.food++;relation(a,d.target).trust+=.08;relation(d.target,a).trust+=.12;text=`gave food to ${d.target.name}`;}
 else {const dirs=[[1,0],[-1,0],[0,1],[0,-1],[0,0]],v=dirs[Math.floor(Math.random()*dirs.length)];a.x=Math.max(0,Math.min(W-1,a.x+v[0]));a.y=Math.max(0,Math.min(H-1,a.y+v[1]));text='explored nearby';}
 a.last=text;remember(a,text);return text;
}
function tick(){state.tick++;state.hour++;if(state.hour>=24){state.hour=0;state.day++;sites.filter(s=>s.stock!=null).forEach(s=>s.stock=Math.min(24,s.stock+2));}
 for(const a of state.agents){a.energy=Math.max(0,a.energy-.7);a.hydration=Math.max(0,a.hydration-1.05);a.social=Math.max(0,a.social-.35);if(a.energy===0||a.hydration===0)a.health=Math.max(0,a.health-2);else a.health=Math.min(100,a.health+.08);const text=act(a,decide(a));state.log.unshift(`T${state.tick} ${a.name}: ${text}`)}
 state.log=state.log.slice(0,160);save();render();}
function resize(){const r=canvas.getBoundingClientRect();canvas.width=Math.floor(r.width*dpr);canvas.height=Math.floor(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);renderWorld()}
function renderWorld(){const cw=canvas.clientWidth,ch=canvas.clientHeight,s=Math.min(cw/W,ch/H),ox=(cw-W*s)/2,oy=(ch-H*s)/2;ctx.clearRect(0,0,cw,ch);ctx.fillStyle='#09101b';ctx.fillRect(0,0,cw,ch);
 ctx.strokeStyle='#172234';ctx.lineWidth=1;for(let x=0;x<=W;x++){ctx.beginPath();ctx.moveTo(ox+x*s,oy);ctx.lineTo(ox+x*s,oy+H*s);ctx.stroke()}for(let y=0;y<=H;y++){ctx.beginPath();ctx.moveTo(ox,oy+y*s);ctx.lineTo(ox+W*s,oy+y*s);ctx.stroke()}
 const colors={water:'#60a5fa',food:'#4ade80',market:'#f59e0b',work:'#c084fc',hazard:'#fb7185'};for(const p of sites){ctx.fillStyle=colors[p.type];ctx.globalAlpha=.24;ctx.fillRect(ox+p.x*s+2,oy+p.y*s+2,s-4,s-4);ctx.globalAlpha=1;ctx.font=`${Math.max(9,s*.27)}px system-ui`;ctx.textAlign='center';ctx.fillStyle='#dbeafe';ctx.fillText(p.label,ox+(p.x+.5)*s,oy+(p.y+.58)*s)}
 for(const a of state.agents){const x=ox+(a.x+.5)*s,y=oy+(a.y+.5)*s,r=Math.max(7,s*.26);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=a.color;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#f8fafc';ctx.stroke();ctx.fillStyle='#fff';ctx.font=`bold ${Math.max(10,s*.3)}px system-ui`;ctx.fillText(a.name[0],x,y+4);ctx.font=`${Math.max(9,s*.25)}px system-ui`;ctx.fillText(a.name,x,y+r+12)} }
function meter(v){return `<div class="meter"><i style="width:${Math.max(0,Math.min(100,v))}%"></i></div>`}
function render(){renderWorld();document.querySelector('#hud').innerHTML=`Day <b>${state.day}</b> · ${String(state.hour).padStart(2,'0')}:00 · Tick <b>${state.tick}</b>`;document.querySelector('#agents').innerHTML=state.agents.map(a=>`<div class="agent"><div class="row"><span class="name" style="color:${a.color}">${a.name}</span><span>${a.role}</span></div><div class="sub">${a.last}</div><div class="row sub"><span>Health ${a.health.toFixed(0)}</span><span>Energy ${a.energy.toFixed(0)}</span><span>Water ${a.hydration.toFixed(0)}</span></div>${meter(Math.min(a.health,a.energy,a.hydration))}<div class="row sub"><span>Food ${a.food}</span><span>Credits ${a.credits}</span><span>Goal ${a.goal}</span></div></div>`).join('');document.querySelector('#log').innerHTML=state.log.slice(0,70).map(x=>`<div class="entry">${x.replace(/^T(\d+) ([^:]+):/,'<b>T$1 $2</b>:')}</div>`).join('');document.querySelector('#status').innerHTML=`State persists in <strong>this browser</strong>. No backend or external model is required.`;}
function setRunning(on){if(timer)clearInterval(timer);timer=null;document.querySelector('#run').textContent=on?'Pause':'Run';if(on)timer=setInterval(tick,+document.querySelector('#speed').value)}
document.querySelector('#run').onclick=()=>setRunning(!timer);document.querySelector('#step').onclick=tick;document.querySelector('#reset').onclick=()=>{setRunning(false);localStorage.removeItem(STORAGE);state=fresh();save();render()};document.querySelector('#speed').onchange=()=>{if(timer)setRunning(true)};window.addEventListener('resize',resize);
state=load();resize();render();
})();
</script>
</body></html>
