<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Human Project — Shared World</title>
<style>body{margin:0;background:#070b12;color:#e5edf7;font-family:system-ui}header{padding:16px 20px;border-bottom:1px solid #263244;display:flex;justify-content:space-between}main{display:grid;grid-template-columns:1fr 360px;gap:14px;padding:14px}.card{background:#111827;border:1px solid #263244;border-radius:14px;overflow:hidden}canvas{width:100%;height:70vh;display:block}.side{padding:12px}.agent{padding:10px;border-bottom:1px solid #263244}.muted{color:#94a3b8}.ok{color:#4ade80}.bad{color:#fb7185}@media(max-width:850px){main{grid-template-columns:1fr}canvas{height:55vh}}</style></head>
<body><header><div><b>Human Project: Shared Persistent World</b><div class="muted">One authoritative server; every viewer sees the same agents.</div></div><div id="status" class="bad">Connecting…</div></header><main><section class="card"><canvas id="world"></canvas></section><aside class="card side"><h3>Agents</h3><div id="agents"></div><h3>Recent turns</h3><div id="turns" class="muted"></div></aside></main>
<script>
const c=document.querySelector('#world'),x=c.getContext('2d'),statusEl=document.querySelector('#status');let state=null;
function resize(){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);draw()}addEventListener('resize',resize);
function draw(){if(!state)return;const w=state.world.width,h=state.world.height,cw=c.clientWidth,ch=c.clientHeight,s=Math.min(cw/w,ch/h),ox=(cw-w*s)/2,oy=(ch-h*s)/2;x.clearRect(0,0,cw,ch);x.fillStyle='#09101b';x.fillRect(0,0,cw,ch);x.strokeStyle='#172234';for(let i=0;i<=w;i++){x.beginPath();x.moveTo(ox+i*s,oy);x.lineTo(ox+i*s,oy+h*s);x.stroke()}for(let j=0;j<=h;j++){x.beginPath();x.moveTo(ox,oy+j*s);x.lineTo(ox+w*s,oy+j*s);x.stroke()}const colors={water:'#60a5fa',food:'#4ade80',market:'#f59e0b',job:'#c084fc',hazard:'#fb7185',shelter:'#a3e635'};for(const o of state.world.objects){x.fillStyle=colors[o.kind]||'#64748b';x.globalAlpha=.3;x.fillRect(ox+o.x*s+2,oy+o.y*s+2,s-4,s-4);x.globalAlpha=1}const ac=['#38bdf8','#f472b6','#facc15'];state.agents.forEach((a,i)=>{const px=ox+(a.x+.5)*s,py=oy+(a.y+.5)*s;x.beginPath();x.arc(px,py,Math.max(7,s*.27),0,Math.PI*2);x.fillStyle=ac[i%ac.length];x.fill();x.strokeStyle='#fff';x.stroke();x.fillStyle='#fff';x.textAlign='center';x.font='bold 12px system-ui';x.fillText(a.name[0],px,py+4)})}
function render(d){state=d;draw();document.querySelector('#agents').innerHTML=d.agents.map(a=>`<div class="agent"><b>${a.name}</b> <span class="muted">${a.role}</span><br><span class="muted">${a.last_action} · energy ${(a.energy*100).toFixed(0)} · water ${(a.hydration*100).toFixed(0)} · credits $${a.credits.toFixed(0)}</span></div>`).join('');document.querySelector('#turns').innerHTML=(d.turns||[]).map(t=>`<div>${t.agent_id}: ${t.result}</div>`).join('')||`Tick ${d.world.tick}`}
async function connect(){try{const initial=await fetch('/api/state').then(r=>r.json());render(initial);const protocol=location.protocol==='https:'?'wss':'ws',ws=new WebSocket(`${protocol}://${location.host}/ws`);ws.onopen=()=>{statusEl.textContent='Live';statusEl.className='ok';ws.send('ready')};ws.onmessage=e=>render(JSON.parse(e.data));ws.onclose=()=>{statusEl.textContent='Reconnecting…';statusEl.className='bad';setTimeout(connect,1500)}}catch{statusEl.textContent='Server unavailable';setTimeout(connect,2000)}}resize();connect();
</script></body></html>
