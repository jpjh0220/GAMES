<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sol Live</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#10151d;--line:#253041;--text:#eef4ff;--muted:#8fa2bc;--accent:#66e3ff;--danger:#ff6b6b;--npc:#ffd166;--item:#7ee787;--player:#c39bff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1200px;margin:auto;padding:14px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}.title{font-size:20px;font-weight:700}.status{display:flex;gap:8px;align-items:center;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;background:var(--danger)}.dot.live{background:#3ddc84;box-shadow:0 0 14px #3ddc84}.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.scene{padding:0;overflow:hidden;position:relative;min-height:520px}.scene canvas{width:100%;height:520px;display:block;background:#0b1118}.hud{position:absolute;left:12px;top:12px;background:#080b10cc;border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:70%}.hud b{color:var(--accent)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.metric{background:#0b1118;border:1px solid var(--line);border-radius:10px;padding:9px}.metric small{display:block;color:var(--muted);margin-bottom:2px}.metric strong{font-size:18px}.section{margin-top:12px}.section h3{font-size:13px;margin:0 0 7px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}.skills,.inventory{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.row{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#0b1118}.feed{max-height:230px;overflow:auto;display:flex;flex-direction:column-reverse;gap:6px}.event{border-left:3px solid var(--accent);padding:6px 8px;background:#0b1118;border-radius:6px}.event .time{color:var(--muted);font-size:11px}.legend{position:absolute;right:12px;bottom:12px;background:#080b10cc;border:1px solid var(--line);border-radius:10px;padding:8px}.legend div{margin:3px 0}.sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}@media(max-width:760px){.grid{grid-template-columns:1fr}.scene,.scene canvas{min-height:430px;height:430px}.metrics{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="title">SOL // LIVE WORLD OBSERVER</div><div id="subtitle" style="color:var(--muted)">Connecting to agent telemetry…</div></div><div class="status"><span id="dot" class="dot"></span><span id="status">offline</span></div></div>
  <div class="grid">
    <div class="panel scene"><canvas id="scene"></canvas><div class="hud"><div>Action: <b id="action">—</b></div><div id="coords" style="color:var(--muted)">—</div></div><div class="legend"><div><span class="sw" style="background:var(--accent)"></span>Sol</div><div><span class="sw" style="background:var(--npc)"></span>NPC</div><div><span class="sw" style="background:var(--player)"></span>Player</div><div><span class="sw" style="background:var(--item)"></span>Ground item</div></div></div>
    <div class="panel">
      <div class="metrics"><div class="metric"><small>Combat</small><strong id="combat">—</strong></div><div class="metric"><small>HP</small><strong id="hp">—</strong></div><div class="metric"><small>Tick</small><strong id="tick">—</strong></div></div>
      <div class="section"><h3>Skills</h3><div id="skills" class="skills"></div></div>
      <div class="section"><h3>Inventory</h3><div id="inventory" class="inventory"></div></div>
      <div class="section"><h3>Recent decisions</h3><div id="feed" class="feed"></div></div>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id), canvas=$('scene'), ctx=canvas.getContext('2d');let last=null,lastSeen=0;
function resize(){const d=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(s){last=s;lastSeen=Date.now();$('dot').classList.add('live');$('status').textContent='LIVE';$('subtitle').textContent='Sol5 • read-only spectator telemetry • '+new Date(s.updatedAt).toLocaleTimeString();$('action').textContent=s.currentAction?.label||'observing';$('coords').textContent=s.player?`world ${s.player.worldX}, ${s.player.worldZ} • plane ${s.player.level}`:'loading world';$('combat').textContent=s.player?.combatLevel??'—';$('hp').textContent=s.player?`${s.player.hp}/${s.player.maxHp}`:'—';$('tick').textContent=s.tick??'—';
 $('skills').innerHTML=(s.skills||[]).filter(x=>!/^Stat/.test(x.name)).map(x=>`<div class="row"><span>${esc(x.name)}</span><b>${x.level}</b></div>`).join('');
 $('inventory').innerHTML=(s.inventory||[]).map(x=>`<div class="row"><span>${esc(x.name)}</span><b>${x.count>1?x.count:''}</b></div>`).join('')||'<span style="color:var(--muted)">Empty</span>';
 $('feed').innerHTML=(s.actions||[]).slice(-30).reverse().map(x=>`<div class="event"><div><b>${esc(x.label)}</b> ${esc(x.summary||'')}</div><div class="time">tick ${x.tick}</div></div>`).join('');draw(s)}
function draw(s){resize();const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#0b1118';ctx.fillRect(0,0,w,h);const p=s.player;if(!p)return;const scale=Math.max(9,Math.min(18,w/45));const cx=w/2,cy=h/2;ctx.strokeStyle='#172232';ctx.lineWidth=1;for(let x=cx%scale;x<w;x+=scale){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=cy%scale;y<h;y+=scale){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
 const pt=(x,z)=>[cx+(x-p.worldX)*scale,cy-(z-p.worldZ)*scale];function mark(x,z,color,r,label){const q=pt(x,z);if(q[0]<-30||q[0]>w+30||q[1]<-30||q[1]>h+30)return;ctx.fillStyle=color;ctx.beginPath();ctx.arc(q[0],q[1],r,0,Math.PI*2);ctx.fill();if(label){ctx.font='11px system-ui';ctx.fillStyle='#e8eef8';ctx.fillText(label,q[0]+r+4,q[1]+4)}}
 (s.groundItems||[]).forEach(x=>mark(x.x,x.z,'#7ee787',3,x.name));(s.nearbyNpcs||[]).forEach(x=>mark(x.x,x.z,'#ffd166',5,`${x.name}${x.combatLevel?` [${x.combatLevel}]`:''}`));(s.nearbyPlayers||[]).forEach(x=>mark(x.x,x.z,'#c39bff',5,x.name));mark(p.worldX,p.worldZ,'#66e3ff',8,'Sol5');ctx.strokeStyle='#66e3ff55';ctx.beginPath();ctx.arc(cx,cy,scale*15,0,Math.PI*2);ctx.stroke()}
async function poll(){try{const r=await fetch('/state?'+Date.now(),{cache:'no-store'});if(r.ok)render(await r.json())}catch(e){}if(Date.now()-lastSeen>5000){$('dot').classList.remove('live');$('status').textContent='reconnecting'}setTimeout(poll,650)}poll();
</script>
</body>
</html>
