name: Sol Live Continuous Runner

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rs-sol-live.yml'
      - 'sol-live/**'

permissions:
  contents: write
  actions: write

concurrency:
  group: sol-continuous-world
  cancel-in-progress: false

jobs:
  sol-live:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout viewer code
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clone RS-SDK
        run: git clone --depth 1 https://github.com/MaxBittker/rs-sdk.git rs-sdk

      - name: Install dependencies
        run: |
          cd rs-sdk && bun install --frozen-lockfile
          cd server/webclient && bun install --frozen-lockfile
          cp ../../../sol-live/sol-live.ts ./sol-live.ts
          cp ../../../sol-live/viewer.html ./viewer.html

      - name: Start public spectator tunnel
        id: tunnel
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          nohup /tmp/cloudflared tunnel --url http://127.0.0.1:8787 --no-autoupdate > sol-tunnel.log 2>&1 &
          echo $! > sol-tunnel.pid
          URL=''
          for i in $(seq 1 45); do
            URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' sol-tunnel.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 1
          done
          if [ -z "$URL" ]; then
            cat sol-tunnel.log
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Spectator tunnel: $URL"

      - name: Publish current spectator endpoint
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_URL: ${{ steps.tunnel.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          JSON=$(jq -cn \
            --arg url "$LIVE_URL" \
            --arg updatedAt "$NOW" \
            --argjson runNumber "$GITHUB_RUN_NUMBER" \
            --argjson runId "$GITHUB_RUN_ID" \
            '{url:$url,updatedAt:$updatedAt,runNumber:$runNumber,runId:$runId,agent:"Sol5"}')
          CONTENT=$(printf '%s\n' "$JSON" | base64 -w0)
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/sol-watch/live.json" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/sol-watch/live.json" \
              -f message="Update Sol live spectator endpoint" \
              -f content="$CONTENT" \
              -f sha="$SHA" >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/sol-watch/live.json" \
              -f message="Create Sol live spectator endpoint" \
              -f content="$CONTENT" >/dev/null
          fi
          echo "$JSON"

      - name: Run persistent Sol with live telemetry
        working-directory: rs-sdk/server/webclient
        env:
          SOL_USER: Sol5
          SOL_PASS: run-31675285392-1
        run: |
          set -o pipefail
          bun sol-live.ts 2>&1 | tee ../../sol-console.log

      - name: Upload session logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-live-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            rs-sdk/sol-session.log
            rs-sdk/sol-console.log
            sol-tunnel.log
          if-no-files-found: warn

      - name: Hand Sol to the next live runner
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --retry 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rs-sol-live.yml/dispatches" \
            -d '{"ref":"main"}'
