name: Sol Live Continuous Runner
# Repository-aware AI: loads rs-sdk learnings and API guidance at runtime.

on:
  workflow_dispatch:
    inputs:
      chain_depth:
        description: Number of automatic runner handoffs already completed
        required: false
        default: '0'
        type: string
      previous_run_id:
        description: GitHub Actions run ID whose game database should be restored
        required: false
        default: ''
        type: string
      previous_artifact_name:
        description: Artifact name containing the previous game database
        required: false
        default: ''
        type: string
  push:
    paths:
      - '.github/workflows/rs-sol-live.yml'
      - 'sol-live/**'

permissions:
  contents: write
  actions: write

# This runner is intentionally long-lived, but all runtime inputs are pinned or secret-backed.
env:
  RS_SDK_REF: 2ae032c99813a72d8d749d6d105fc7378255b03a
  BUN_VERSION: '1.3.3'
  CLOUDFLARED_VERSION: '2026.8.2'
  OLLAMA_VERSION: '0.32.13'
  MAX_CHAIN_DEPTH: '3'
  CHAIN_DEPTH: ${{ inputs.chain_depth || '0' }}
  PREVIOUS_RUN_ID: ${{ inputs.previous_run_id || '' }}
  PREVIOUS_ARTIFACT_NAME: ${{ inputs.previous_artifact_name || '' }}
  SOL_RUNTIME_MODE: local

concurrency:
  group: sol-continuous-world
  cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[activate-agent]') }}

jobs:
  sol-live:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout viewer and agent code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Clone pinned RS-SDK
        run: |
          set -euo pipefail
          git clone https://github.com/MaxBittker/rs-sdk.git rs-sdk
          git -C rs-sdk checkout --detach "$RS_SDK_REF"
          test "$(git -C rs-sdk rev-parse HEAD)" = "$RS_SDK_REF"

      - name: Install dependencies and stage agent
        run: |
          cd rs-sdk && bun install --frozen-lockfile
          cd server/webclient && bun install --frozen-lockfile
          cp ../../../sol-live/*.ts ./
          cp ../../../sol-live/recover-sol5-save.mjs ./recover-sol5-save.mjs
          cp ../../../sol-live/viewer.html ./viewer.html
          bun build sol-live.ts --target=bun --outfile=/tmp/sol-live-agent.js

      - name: Restore previous rs-sdk game database
        if: env.SOL_RUNTIME_MODE == 'local' && env.PREVIOUS_RUN_ID != '' && env.PREVIOUS_ARTIFACT_NAME != ''
        working-directory: rs-sdk/server/engine
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/game-db-restore"
          mkdir -p "$GITHUB_WORKSPACE/game-db-restore"
          gh run download "$PREVIOUS_RUN_ID" --name "$PREVIOUS_ARTIFACT_NAME" --dir "$GITHUB_WORKSPACE/game-db-restore"
          DB_PATH=$(find "$GITHUB_WORKSPACE/game-db-restore" -type f -name 'db.sqlite' -print -quit)
          if [ -z "$DB_PATH" ]; then
            echo 'Previous game artifact did not contain db.sqlite.' >&2
            exit 1
          fi
          cp "$DB_PATH" ./db.sqlite
          test -s ./db.sqlite
          while IFS= read -r SAVE_PATH; do
            mkdir -p ./data/players/main
            cp "$SAVE_PATH" "./data/players/main/$(basename "$SAVE_PATH")"
          done < <(find "$GITHUB_WORKSPACE/game-db-restore" -type f -name '*.sav' -print)
          echo "Restored rs-sdk database and any available player-save blobs from run $PREVIOUS_RUN_ID."

      - name: Start local rs-sdk game and login server
        if: env.SOL_RUNTIME_MODE == 'local'
        working-directory: rs-sdk/server/engine
        shell: bash
        env:
          EASY_STARTUP: 'true'
          LOGIN_SERVER: 'true'
          FRIEND_SERVER: 'true'
          LOGGER_SERVER: 'true'
          WEB_PORT: '8080'
          NODE_PORT: '43594'
          NODE_MEMBERS: 'true'
          NODE_RANDOM_EVENTS: 'false'
          NODE_TICKRATE: '300'
          NODE_XPRATE: '25'
          WEBSITE_REGISTRATION: 'false'
          SOL_USER: ${{ secrets.SOL_USER }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run sqlite:migrate
          RECOVERY_DIR="./data/players/main"
          RECOVERY_MARKER="$RECOVERY_DIR/.sol-verified-recovery-v2"
          NORMALIZED_SOL_USER="$(printf '%s' "$SOL_USER" | tr '[:upper:]' '[:lower:]')"
          if [ ! -f "$RECOVERY_MARKER" ]; then
            mkdir -p "$RECOVERY_DIR"
            node ../webclient/recover-sol5-save.mjs "$RECOVERY_DIR/${SOL_USER}.sav" --force
            if [ "$NORMALIZED_SOL_USER" != "$SOL_USER" ]; then
              node ../webclient/recover-sol5-save.mjs "$RECOVERY_DIR/${NORMALIZED_SOL_USER}.sav" --force
            fi
            printf 'verified remote Sol5 skill recovery v2 open-spawn\n' > "$RECOVERY_MARKER"
          else
            echo "Preserving verified recovered player saves from $RECOVERY_DIR"
          fi
          nohup env EASY_STARTUP="$EASY_STARTUP" LOGIN_SERVER="$LOGIN_SERVER" FRIEND_SERVER="$FRIEND_SERVER" LOGGER_SERVER="$LOGGER_SERVER" WEB_PORT="$WEB_PORT" NODE_PORT="$NODE_PORT" NODE_MEMBERS="$NODE_MEMBERS" NODE_RANDOM_EVENTS="$NODE_RANDOM_EVENTS" NODE_TICKRATE="$NODE_TICKRATE" NODE_XPRATE="$NODE_XPRATE" WEBSITE_REGISTRATION="$WEBSITE_REGISTRATION" bun run src/app.ts > "$GITHUB_WORKSPACE/rs-engine.log" 2>&1 &
          ENGINE_PID=$!
          echo "$ENGINE_PID" > "$GITHUB_WORKSPACE/rs-engine.pid"
          for i in $(seq 1 120); do
            if grep -q 'World ready:' "$GITHUB_WORKSPACE/rs-engine.log" && curl -fsS --max-time 3 http://127.0.0.1:8080/ >/dev/null; then
              echo 'Local rs-sdk engine and login server are ready.'
              exit 0
            fi
            if ! kill -0 "$ENGINE_PID" 2>/dev/null; then
              cat "$GITHUB_WORKSPACE/rs-engine.log"
              exit 1
            fi
            sleep 2
          done
          cat "$GITHUB_WORKSPACE/rs-engine.log"
          exit 1

      - name: Install pinned local Ollama runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}"
          curl -fL --retry 4 --retry-delay 2 -o /tmp/ollama-linux-amd64.tar.zst "${BASE_URL}/ollama-linux-amd64.tar.zst"
          curl -fL --retry 4 --retry-delay 2 -o /tmp/ollama-sha256sum.txt "${BASE_URL}/sha256sum.txt"
          cd /tmp
          grep 'ollama-linux-amd64.tar.zst' ollama-sha256sum.txt | sha256sum -c -
          sudo tar --zstd -xf ollama-linux-amd64.tar.zst -C /usr
          nohup env OLLAMA_CONTEXT_LENGTH=4096 ollama serve > "$GITHUB_WORKSPACE/sol-ollama.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/sol-ollama.pid"
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$GITHUB_WORKSPACE/sol-ollama.log"
          exit 1

      - name: Restore local AI model cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: sol-qwen3-dual-0.6b-1.7b-v1

      - name: Prepare dual AI models
        shell: bash
        run: |
          set -euo pipefail
          ollama pull qwen3:0.6b
          ollama pull qwen3:1.7b
          ollama list > /tmp/ollama-models.txt
          grep -Fq 'qwen3:0.6b' /tmp/ollama-models.txt
          grep -Fq 'qwen3:1.7b' /tmp/ollama-models.txt
          echo 'Fast motor AI and strategist AI are ready.'

      - name: Start public spectator tunnel
        id: tunnel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 -o /tmp/cloudflared "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          chmod +x /tmp/cloudflared
          cat > /tmp/sol-tunnel-supervisor.sh <<'TUNNELSUP'
          #!/usr/bin/env bash
          set -u
          while true; do
            : > sol-tunnel.log
            /tmp/cloudflared tunnel --url http://127.0.0.1:8787 --no-autoupdate >> sol-tunnel.log 2>&1 &
            TUNNEL_PID=$!
            echo "$TUNNEL_PID" > sol-tunnel.pid
            URL=''
            for j in $(seq 1 45); do
              URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' sol-tunnel.log | head -1 || true)
              [ -n "$URL" ] && break
              sleep 1
            done
            if [ -n "$URL" ]; then
              NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              JSON=$(jq -cn --arg url "$URL" --arg updatedAt "$NOW" --argjson runNumber "$GITHUB_RUN_NUMBER" --argjson runId "$GITHUB_RUN_ID" '{url:$url,updatedAt:$updatedAt,runNumber:$runNumber,runId:$runId,agent:"Sol",controller:"model-sovereign-gameplay-with-execution-validation",provider:"gemini",motor:"gemini-3.5-flash-lite",strategist:"gemini-3.5-flash-lite",viewerAccess:"token-required-when-configured"}')
              CONTENT=$(printf '%s\n' "$JSON" | base64 -w0)
              SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/sol-watch/live.json" --jq .sha 2>/dev/null || true)
              if [ -n "$SHA" ]; then
                gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/sol-watch/live.json" -f message="Refresh Sol spectator tunnel" -f content="$CONTENT" -f sha="$SHA" >/dev/null || true
              else
                gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/sol-watch/live.json" -f message="Publish Sol spectator tunnel" -f content="$CONTENT" >/dev/null || true
              fi
              echo "url=$URL" > /tmp/sol-live-url
            fi
            wait "$TUNNEL_PID" || true
            sleep 2
          done
          TUNNELSUP
          chmod +x /tmp/sol-tunnel-supervisor.sh
          nohup /tmp/sol-tunnel-supervisor.sh > /tmp/sol-tunnel-supervisor.log 2>&1 &
          echo $! > sol-tunnel-supervisor.pid
          URL=''
          for i in $(seq 1 45); do
            URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' sol-tunnel.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 1
          done
          if [ -z "$URL" ]; then cat sol-tunnel.log; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Spectator tunnel: $URL"

      - name: Start Sol, verify health, and publish spectator endpoint
        working-directory: rs-sdk/server/webclient
        env:
          SOL_USER: ${{ secrets.SOL_USER }}
          SOL_PASS: ${{ secrets.SOL_PASS }}
          SOL_VIEWER_TOKEN: ${{ secrets.SOL_VIEWER_TOKEN }}
          SOL_GAME_HOST: 127.0.0.1:8080
          SOL_CONTROL_TOKEN: ${{ secrets.SOL_CONTROL_TOKEN }}
          SOL_LLM_PROVIDER: gemini
          SOL_MOTOR_MODEL: gemini-3.5-flash-lite
          SOL_STRATEGIST_MODEL: gemini-3.5-flash-lite
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OLLAMA_URL: http://127.0.0.1:11434
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LIVE_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          set -euo pipefail
          : "${SOL_USER:?Repository secret SOL_USER is required}"
          : "${SOL_PASS:?Repository secret SOL_PASS is required}"
          bun sol-live.ts > >(tee ../../sol-console.log) 2>&1 &
          AGENT_PID=$!
          READY=''
          for i in $(seq 1 120); do
            if ! kill -0 "$AGENT_PID" 2>/dev/null; then
              wait "$AGENT_PID"
              exit 1
            fi
            HEALTH=$(curl -sS --max-time 3 http://127.0.0.1:8787/health || true)
            if [ -n "$HEALTH" ] && printf '%s' "$HEALTH" | jq -e '.ok == true' >/dev/null; then
              READY=1
              break
            fi
            if [ "$i" = 1 ] || [ $((i % 15)) -eq 0 ]; then
              printf 'Sol readiness pending: '; printf '%s' "${HEALTH:-no response}" | jq -c '{ok,online,inGame,tick,actionCount,agentController,teacherOnline}' 2>/dev/null || printf '%s\n' 'unparseable health response'
            fi
            sleep 2
          done
          if [ -z "$READY" ]; then
            echo 'Sol did not become healthy before the readiness deadline.'
            exit 1
          fi
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          JSON=$(jq -cn --arg url "$LIVE_URL" --arg updatedAt "$NOW" --argjson runNumber "$GITHUB_RUN_NUMBER" --argjson runId "$GITHUB_RUN_ID" '{url:$url,updatedAt:$updatedAt,runNumber:$runNumber,runId:$runId,agent:"Sol",controller:"model-sovereign-gameplay-with-execution-validation",provider:"gemini",motor:"gemini-3.5-flash-lite",strategist:"gemini-3.5-flash-lite",viewerAccess:"token-required-when-configured"}')
          CONTENT=$(printf '%s\n' "$JSON" | base64 -w0)
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/sol-watch/live.json" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/sol-watch/live.json" -f message="Update Sol live spectator endpoint" -f content="$CONTENT" -f sha="$SHA" >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/sol-watch/live.json" -f message="Create Sol live spectator endpoint" -f content="$CONTENT" >/dev/null
          fi
          echo "Published healthy spectator endpoint: $LIVE_URL"
          wait "$AGENT_PID"

      - name: Upload session logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-live-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            rs-sdk/sol-session.log
            rs-sdk/server/webclient/sol-cognition.ndjson
            rs-sdk/sol-console.log
            sol-tunnel.log
            sol-ollama.log
            rs-engine.log
          if-no-files-found: warn

      - name: Upload game account database for handoff
        if: success() && env.SOL_RUNTIME_MODE == 'local'
        uses: actions/upload-artifact@v4
        with:
          name: sol-game-db-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            rs-sdk/server/engine/db.sqlite
            rs-sdk/server/engine/data/players
          retention-days: 14
          if-no-files-found: error

      # Rechain only healthy sessions and cap the retry chain. Failed live runs
      # now stop for diagnosis instead of consuming Actions capacity indefinitely.
      - name: Hand Sol to the next live runner
        if: success() && steps.tunnel.outputs.url != '' && fromJSON(env.CHAIN_DEPTH) < fromJSON(env.MAX_CHAIN_DEPTH)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEXT_DEPTH=$((CHAIN_DEPTH + 1))
          echo "Rechaining healthy session depth $NEXT_DEPTH of $MAX_CHAIN_DEPTH"
          PAYLOAD=$(jq -cn --arg depth "$NEXT_DEPTH" '{ref:"main",inputs:{chain_depth:$depth}}')
          curl --fail-with-body --retry 3 -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rs-sol-live.yml/dispatches" -d "$PAYLOAD"
