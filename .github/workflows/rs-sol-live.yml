name: Sol Live Continuous Runner
# Repository-aware AI: loads rs-sdk learnings and API guidance at runtime.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rs-sol-live.yml'
      - 'sol-live/**'

permissions:
  contents: write
  actions: write

concurrency:
  group: sol-continuous-world
  cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[activate-agent]') }}

jobs:
  sol-live:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout viewer and agent code
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clone RS-SDK
        run: git clone --depth 1 https://github.com/MaxBittker/rs-sdk.git rs-sdk

      - name: Install dependencies and stage agent
        run: |
          cd rs-sdk && bun install --frozen-lockfile
          cd server/webclient && bun install --frozen-lockfile
          cp ../../../sol-live/sol-live.ts ./sol-live.ts
          cp ../../../sol-live/agent-brain.ts ./agent-brain.ts
          cp ../../../sol-live/viewer.html ./viewer.html
          bun build sol-live.ts --target=bun --outfile=/tmp/sol-live-agent.js

      - name: Install local Ollama runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup env OLLAMA_CONTEXT_LENGTH=4096 ollama serve > sol-ollama.log 2>&1 &
          echo $! > sol-ollama.pid
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat sol-ollama.log
          exit 1

      - name: Restore local AI model cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: sol-qwen3-dual-0.6b-1.7b-v1

      - name: Prepare dual AI models
        shell: bash
        run: |
          set -euo pipefail
          ollama pull qwen3:0.6b
          ollama pull qwen3:1.7b
          ollama list | grep -q 'qwen3:0.6b'
          ollama list | grep -q 'qwen3:1.7b'
          echo 'Fast motor AI and strategist AI are ready.'

      - name: Start public spectator tunnel
        id: tunnel
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          nohup /tmp/cloudflared tunnel --url http://127.0.0.1:8787 --no-autoupdate > sol-tunnel.log 2>&1 &
          echo $! > sol-tunnel.pid
          URL=''
          for i in $(seq 1 45); do
            URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' sol-tunnel.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 1
          done
          if [ -z "$URL" ]; then cat sol-tunnel.log; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Spectator tunnel: $URL"

      - name: Publish current spectator endpoint
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_URL: ${{ steps.tunnel.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          JSON=$(jq -cn --arg url "$LIVE_URL" --arg updatedAt "$NOW" --argjson runNumber "$GITHUB_RUN_NUMBER" --argjson runId "$GITHUB_RUN_ID" '{url:$url,updatedAt:$updatedAt,runNumber:$runNumber,runId:$runId,agent:"Sol5",controller:"dual-ai-player-shadow-learner",motor:"qwen3:0.6b",strategist:"qwen3:1.7b"}')
          CONTENT=$(printf '%s\n' "$JSON" | base64 -w0)
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/sol-watch/live.json" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/sol-watch/live.json" -f message="Update Sol live spectator endpoint" -f content="$CONTENT" -f sha="$SHA" >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/sol-watch/live.json" -f message="Create Sol live spectator endpoint" -f content="$CONTENT" >/dev/null
          fi
          echo "$JSON"

      - name: Run persistent Sol learning agent
        working-directory: rs-sdk/server/webclient
        env:
          SOL_USER: Sol5
          SOL_PASS: run-31675285392-1
          SOL_AGENT_MODEL: qwen3:1.7b
          OLLAMA_URL: http://127.0.0.1:11434
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -o pipefail
          bun sol-live.ts 2>&1 | tee ../../sol-console.log

      - name: Upload session logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-live-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            rs-sdk/sol-session.log
            rs-sdk/sol-console.log
            sol-tunnel.log
            sol-ollama.log
          if-no-files-found: warn

      - name: Hand Sol to the next live runner
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --retry 3 -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rs-sol-live.yml/dispatches" -d '{"ref":"main"}'
