name: Sol RS-SDK Expedition Retry

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rs-sol-expedition-retry.yml'

permissions:
  contents: read

jobs:
  expedition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Get controller and SDK
        run: |
          git clone --depth 1 https://github.com/jpjh0220/GAMES.git games
          git clone --depth 1 https://github.com/MaxBittker/rs-sdk.git rs-sdk
          awk '/cat > sol-expedition.ts <<'"'"'EOF'"'"'/{capture=1;next} capture && /^          EOF$/{exit} capture{sub(/^          /,"");print}' games/.github/workflows/rs-sol-expedition.yml > rs-sdk/server/webclient/sol-expedition.ts
      - name: Install
        run: |
          cd rs-sdk && bun install --frozen-lockfile
          cd server/webclient && bun install --frozen-lockfile
      - name: Run expedition
        working-directory: rs-sdk/server/webclient
        env:
          SOL_USER: SolR${{ github.run_number }}
          SOL_PASS: SolR${{ github.run_number }}Pass
        run: |
          set -o pipefail
          bun sol-expedition.ts 2>&1 | tee ../../sol-expedition-console.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-expedition-retry-${{ github.run_number }}
          path: |
            rs-sdk/sol-expedition.log
            rs-sdk/sol-expedition-console.log
          if-no-files-found: warn
