name: Patch Sol Agent Syntax

on:
  push:
    paths:
      - '.github/workflows/sol-agent-code-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fix reflex ternary
        run: |
          python -c "from pathlib import Path; p=Path('sol-live/sol-live.ts'); s=p.read_text(); s=s.replace('p.combat.inCombat?.45:.32','p.combat.inCombat ? .45 : .32'); p.write_text(s)"
          grep -Fq 'p.combat.inCombat ? .45 : .32' sol-live/sol-live.ts
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sol-live/sol-live.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Sol agent reflex ternary'
          git push
