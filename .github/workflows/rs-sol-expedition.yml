name: Sol RS-SDK Expedition

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rs-sol-expedition.yml'

permissions:
  contents: read

jobs:
  sol-expedition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: git clone --depth 1 https://github.com/MaxBittker/rs-sdk.git rs-sdk
      - name: Install
        run: |
          cd rs-sdk && bun install --frozen-lockfile
          cd server/webclient && bun install --frozen-lockfile
      - name: Build expedition controller
        working-directory: rs-sdk/server/webclient
        shell: bash
        run: |
          cat > sol-expedition.ts <<'EOF'
          import { startSession } from './src/lite/session.js';
          import { BotStateCollector } from './src/bot/StateCollector.js';
          import { ActionExecutor } from './src/bot/ActionExecutor.js';
          import type { Client } from './src/client/Client.js';
          import type { BotWorldState } from './src/bot/types.js';
          import { appendFile } from 'fs/promises';

          const username = process.env.SOL_USER!;
          const password = process.env.SOL_PASS!;
          const log = async (event:string,data?:unknown)=>{
            const line=`[${new Date().toISOString()}] ${event}${data===undefined?'':' '+JSON.stringify(data)}\n`;
            process.stdout.write(line); await appendFile('../../sol-expedition.log',line).catch(()=>{});
          };
          const session=await startSession({host:'rs-sdk-demo.fly.dev',username,password,quiet:false,profanityFilter:true});
          const client=session.client;
          const collector=new BotStateCollector(client as unknown as Client);
          const executor=new ActionExecutor(client as unknown as Client); executor.setScanProvider(collector);
          let tick=0,next=0,actions=0,last:BotWorldState|null=null,stage=0,lastStyle=-1;
          let weaponDone=false,shieldDone=false;
          const discoveries=new Set<string>();
          const lessons=new Set<string>();
          const waypoints=[
            {name:'Lumbridge goblins',x:3252,z:3230},
            {name:'Chicken area',x:3237,z:3295},
            {name:'Cow south gate',x:3253,z:3266},
            {name:'Cow field',x:3253,z:3290}
          ];
          const lvl=(s:BotWorldState,n:string)=>s.skills.find(v=>v.name===n)?.level??1;
          const act=(a:any,label:string,data:any={})=>{const r=executor.execute(a);actions++;void log(label,{tick,...data,result:r instanceof Promise?'async':r});return r;};
          const distance=(s:BotWorldState,x:number,z:number)=>Math.abs(s.player.worldX-x)+Math.abs(s.player.worldZ-z);

          await log('SOL_EXPEDITION_START',{username,mission:'build fundamentals, then leave the spawn neighborhood and discover new systems'});
          client.setOnGameTickCallback(()=>{
            tick++;
            try{
              const s=collector.collectState(tick,true) as BotWorldState|null; if(!s?.player)return; last=s;
              if(tick<=3||tick%25===0) void log('STATE',{tick,stage,pos:[s.player.worldX,s.player.worldZ],hp:[s.player.hp,s.player.maxHp],combat:s.player.combatLevel,skills:Object.fromEntries(s.skills.map(v=>[v.name,v.level])),inventory:s.inventory.map(i=>i.name),npcs:s.nearbyNpcs.slice(0,8).map(n=>({name:n.name,d:n.distance,options:n.options})),locs:s.nearbyLocs.slice(0,8).map(l=>({name:l.name,d:l.distance,options:l.options}))});

              if(s.dialog?.isOpen){const i=s.dialog.options?.[0]?.index??1;act({type:'clickDialogOption',optionIndex:i,reason:'advance dialog'},'DIALOG');next=tick+2;return;}
              if(s.interface?.isOpen){act({type:'closeModal',reason:'clear modal'},'MODAL');next=tick+2;return;}
              if(tick<next)return;

              if(s.player.hp>0&&s.player.hp<=Math.max(4,Math.floor(s.player.maxHp*.5))){
                const food=s.inventory.find(i=>i.optionsWithIndex.some(o=>/^eat$/i.test(o.text)));const op=food?.optionsWithIndex.find(o=>/^eat$/i.test(o.text));
                if(food&&op){act({type:'useInventoryItem',slot:food.slot,optionIndex:op.opIndex,reason:'heal'},'EAT',{item:food.name});next=tick+3;return;}
              }

              if(!weaponDone){const w=s.inventory.find(i=>/bronze sword/i.test(i.name))??s.inventory.find(i=>/bronze dagger/i.test(i.name));const op=w?.optionsWithIndex.find(o=>/^wield$/i.test(o.text));weaponDone=true;if(w&&op){act({type:'useInventoryItem',slot:w.slot,optionIndex:op.opIndex,reason:'starter weapon'},'EQUIP',{item:w.name});next=tick+3;return;}}
              if(!shieldDone){const w=s.inventory.find(i=>/shield/i.test(i.name));const op=w?.optionsWithIndex.find(o=>/wield|wear/i.test(o.text));shieldDone=true;if(w&&op){act({type:'useInventoryItem',slot:w.slot,optionIndex:op.opIndex,reason:'starter shield'},'EQUIP',{item:w.name});next=tick+3;return;}}

              const atk=lvl(s,'Attack'),str=lvl(s,'Strength'),def=lvl(s,'Defence');
              const targetSkill=atk<5?'Attack':str<5?'Strength':def<5?'Defence':null;
              if(targetSkill){
                const cs=(s as any).combatStyle; const style=cs?.styles?.find((x:any)=>x.trainsSkills?.includes(targetSkill));
                if(style&&cs.currentStyle!==style.index&&lastStyle!==style.index){act({type:'setCombatStyle',style:style.index,reason:`train ${targetSkill}`},'STYLE',{targetSkill,style:style.name});lastStyle=style.index;next=tick+2;return;}
                if(s.player.combat.inCombat){next=tick+2;return;}
                const npc=s.nearbyNpcs.filter(n=>/rat|chicken|goblin/i.test(n.name)&&n.reachable!==false).filter(n=>n.optionsWithIndex.some(o=>/attack/i.test(o.text))).sort((a,b)=>a.distance-b.distance)[0];
                const op=npc?.optionsWithIndex.find(o=>/attack/i.test(o.text)); if(npc&&op){act({type:'interactNpc',npcIndex:npc.index,optionIndex:op.opIndex,reason:`train ${targetSkill}`},'TRAIN',{target:npc.name,targetSkill,atk,str,def});next=tick+7;return;}
              }

              // Once 5/5/5 is achieved, travel through documented safe Lumbridge landmarks.
              const wp=waypoints[Math.min(stage,waypoints.length-1)];
              const d=distance(s,wp.x,wp.z);
              if(d>8){
                const r=client.walkTo(wp.x,wp.z,true);client.flush();actions++;void log('TRAVEL',{tick,stage,to:wp,from:[s.player.worldX,s.player.worldZ],distance:d,result:r});next=tick+8;return;
              }
              discoveries.add(wp.name); lessons.add(`Reached ${wp.name} using a stable world waypoint.`);

              // Open gates/doors when the current area exposes one.
              const gate=s.nearbyLocs.filter(l=>l.reachable!==false).find(l=>/gate|door/i.test(l.name)&&l.optionsWithIndex.some(o=>/^open$/i.test(o.text)));
              const gateOp=gate?.optionsWithIndex.find(o=>/^open$/i.test(o.text));
              if(gate&&gateOp){act({type:'interactLoc',x:gate.x,z:gate.z,locId:gate.id,optionIndex:gateOp.opIndex,reason:'open route'},'OPEN_ROUTE',{name:gate.name});next=tick+5;return;}

              // Try a newly available gathering interaction before leaving the area.
              const loc=s.nearbyLocs.filter(l=>l.reachable!==false).find(l=>l.optionsWithIndex.some(o=>/chop|mine|net|fish|lure|bait/i.test(o.text)));
              const locOp=loc?.optionsWithIndex.find(o=>/chop|mine|net|fish|lure|bait/i.test(o.text));
              if(loc&&locOp&&tick%12===0){act({type:'interactLoc',x:loc.x,z:loc.z,locId:loc.id,optionIndex:locOp.opIndex,reason:'test gathering system'},'GATHER_DISCOVERY',{name:loc.name,option:locOp.text});lessons.add(`Found gathering interaction: ${locOp.text} on ${loc.name}.`);next=tick+8;return;}

              const npc=s.nearbyNpcs.filter(n=>n.reachable!==false).find(n=>/goblin|chicken|cow/i.test(n.name)&&n.optionsWithIndex.some(o=>/attack/i.test(o.text)));
              const attack=npc?.optionsWithIndex.find(o=>/attack/i.test(o.text));
              if(npc&&attack&&tick%10===0){act({type:'interactNpc',npcIndex:npc.index,optionIndex:attack.opIndex,reason:'sample local creature'},'LOCAL_COMBAT',{area:wp.name,target:npc.name});next=tick+7;return;}

              if(tick%18===0&&stage<waypoints.length-1){stage++;void log('NEXT_AREA',{tick,next:waypoints[stage]});next=tick+2;return;}
            }catch(e){void log('ERROR',String(e));}
          });

          await Bun.sleep(180_000);
          client.setOnGameTickCallback(null);
          await log('SOL_EXPEDITION_COMPLETE',{ticks:tick,actions,discoveries:[...discoveries],lessons:[...lessons],final:last?{pos:[last.player.worldX,last.player.worldZ],hp:[last.player.hp,last.player.maxHp],combat:last.player.combatLevel,skills:Object.fromEntries(last.skills.map(v=>[v.name,v.level])),inventory:last.inventory.map(i=>({name:i.name,count:i.count}))}:null});
          session.stop();await session.stopped;
          EOF
      - name: Run expedition
        working-directory: rs-sdk/server/webclient
        env:
          SOL_USER: SolX${{ github.run_number }}
          SOL_PASS: expedition-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -o pipefail
          bun sol-expedition.ts 2>&1 | tee ../../sol-expedition-console.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-expedition-${{ github.run_number }}
          path: |
            rs-sdk/sol-expedition.log
            rs-sdk/sol-expedition-console.log
          if-no-files-found: warn
