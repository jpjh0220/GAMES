name: Verify Sol Overlay

on:
  push:
    branches: [main]
    paths-ignore:
      - 'sol-watch/live.json'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'sol-watch/live.json'

permissions:
  contents: read

concurrency:
  group: sol-overlay-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  compile-agent:
    name: Compile staged Sol agent
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    env:
      RS_SDK_REF: 2ae032c99813a72d8d749d6d105fc7378255b03a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck:agent
      - run: npm run build:agent
      - uses: actions/upload-artifact@v4
        with:
          name: sol-live-agent
          path: dist/sol-live-agent.js
          if-no-files-found: error
          retention-days: 7
