name: Sol RS-SDK Runner

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rs-sol.yml'
      - 'rs-sol-trigger.txt'

permissions:
  contents: read

jobs:
  sol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clone RS-SDK
        run: git clone --depth 1 https://github.com/MaxBittker/rs-sdk.git rs-sdk

      - name: Install root dependencies
        working-directory: rs-sdk
        run: bun install --frozen-lockfile

      - name: Install webclient dependencies
        working-directory: rs-sdk/server/webclient
        run: bun install --frozen-lockfile

      - name: Create direct LiteClient controller
        working-directory: rs-sdk/server/webclient
        shell: bash
        run: |
          cat > sol-lite.ts <<'EOF'
          import { startSession } from './src/lite/session.js';
          import { BotStateCollector } from './src/bot/StateCollector.js';
          import { ActionExecutor } from './src/bot/ActionExecutor.js';
          import type { Client } from './src/client/Client.js';
          import type { BotWorldState } from './src/bot/types.js';
          import { appendFile } from 'fs/promises';

          const username = process.env.SOL_USER!;
          const password = process.env.SOL_PASS!;
          const log = async (event: string, data?: unknown) => {
            const line = `[${new Date().toISOString()}] ${event}${data === undefined ? '' : ' ' + JSON.stringify(data)}\n`;
            process.stdout.write(line);
            await appendFile('../../sol-session.log', line).catch(() => {});
          };

          await log('SOL_START', { username });
          const session = await startSession({
            host: 'rs-sdk-demo.fly.dev',
            username,
            password,
            quiet: false,
            profanityFilter: true,
            onEnd: end => console.error('SESSION_END', end)
          });

          const client = session.client;
          const asClient = client as unknown as Client;
          const collector = new BotStateCollector(asClient);
          const executor = new ActionExecutor(asClient);
          executor.setScanProvider(collector);

          let tick = 0;
          let acted = 0;
          let lastPos = '';
          let lastState: BotWorldState | null = null;

          client.setOnGameTickCallback(() => {
            tick++;
            try {
              const state = collector.collectState(tick, true) as BotWorldState | null;
              if (!state?.player) return;
              lastState = state;

              const pos = `${state.player.worldX},${state.player.worldZ},${state.player.level}`;
              if (pos !== lastPos || tick % 10 === 0) {
                lastPos = pos;
                void log('STATE', {
                  tick,
                  player: {
                    name: state.player.name,
                    x: state.player.worldX,
                    z: state.player.worldZ,
                    level: state.player.level,
                    hp: state.player.hp,
                    combat: state.player.combatLevel
                  },
                  skills: state.skills.map(s => ({ name: s.name, level: s.level })),
                  inventory: state.inventory.map(i => ({ name: i.name, count: i.count })),
                  nearbyNpcs: state.nearbyNpcs.slice(0, 12).map(n => ({ name: n.name, level: n.combatLevel, distance: n.distance, options: n.options })),
                  dialog: state.dialog,
                  interface: state.interface
                });
              }

              // Clear dialog/interface blockers first. This also advances simple tutorial prompts.
              if (state.dialog?.isOpen) {
                const option = state.dialog.options?.[0]?.index ?? 0;
                executor.execute({ type: 'clickDialogOption', optionIndex: option, reason: 'Sol advances dialog' } as any);
                acted++;
                return;
              }
              if (state.interface?.isOpen) {
                executor.execute({ type: 'closeModal', reason: 'Sol clears modal' } as any);
                acted++;
                return;
              }

              // If a nearby NPC exposes an obvious low-risk interaction, try it.
              const npc = state.nearbyNpcs
                .filter(n => n.reachable !== false)
                .find(n => n.optionsWithIndex.some(o => /talk-to|attack/i.test(o.text)));
              if (npc && tick % 8 === 0) {
                const opt = npc.optionsWithIndex.find(o => /talk-to/i.test(o.text))
                  ?? npc.optionsWithIndex.find(o => /attack/i.test(o.text));
                if (opt) {
                  executor.execute({ type: 'interactNpc', npcIndex: npc.index, optionIndex: opt.opIndex, reason: `Sol chose ${opt.text} on ${npc.name}` } as any);
                  void log('ACTION_NPC', { tick, npc: npc.name, option: opt.text, index: npc.index });
                  acted++;
                  return;
                }
              }

              // Otherwise explore a small reachable area around current position.
              if (tick % 12 === 0) {
                const dx = ((tick / 12) % 3 === 0 ? 4 : (tick / 12) % 3 === 1 ? -3 : 2);
                const dz = ((tick / 12) % 2 === 0 ? 3 : -4);
                const x = state.player.worldX + dx;
                const z = state.player.worldZ + dz;
                const result = client.walkTo(x, z, true);
                client.flush();
                void log('ACTION_WALK', { tick, x, z, result });
                acted++;
              }
            } catch (err) {
              void log('TICK_ERROR', String(err));
            }
          });

          await Bun.sleep(90_000);
          client.setOnGameTickCallback(null);
          await log('SOL_COMPLETE', {
            ticks: tick,
            actions: acted,
            final: lastState?.player ? {
              x: lastState.player.worldX,
              z: lastState.player.worldZ,
              hp: lastState.player.hp,
              inventory: lastState.inventory.map(i => ({ name: i.name, count: i.count }))
            } : null
          });
          session.stop();
          await session.stopped;
          EOF

      - name: Run Sol directly in the game
        working-directory: rs-sdk/server/webclient
        env:
          SOL_USER: Sol${{ github.run_number }}
          SOL_PASS: run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -o pipefail
          bun sol-lite.ts 2>&1 | tee ../../sol-console.log

      - name: Upload session logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-rs-sdk-session-${{ github.run_number }}
          path: |
            rs-sdk/sol-session.log
            rs-sdk/sol-console.log
          if-no-files-found: warn
