name: Sol RS-SDK Runner

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rs-sol.yml'
      - 'rs-sol-trigger.txt'

permissions:
  contents: read

jobs:
  sol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clone RS-SDK
        run: git clone --depth 1 https://github.com/MaxBittker/rs-sdk.git rs-sdk

      - name: Install dependencies
        run: |
          cd rs-sdk && bun install --frozen-lockfile
          cd server/webclient && bun install --frozen-lockfile

      - name: Create Sol autonomous controller
        working-directory: rs-sdk/server/webclient
        shell: bash
        run: |
          cat > sol-lite.ts <<'EOF'
          import { startSession } from './src/lite/session.js';
          import { BotStateCollector } from './src/bot/StateCollector.js';
          import { ActionExecutor } from './src/bot/ActionExecutor.js';
          import type { Client } from './src/client/Client.js';
          import type { BotWorldState } from './src/bot/types.js';
          import { appendFile } from 'fs/promises';

          const username = process.env.SOL_USER!;
          const password = process.env.SOL_PASS!;
          const RUN_MS = 150_000;
          const log = async (event: string, data?: unknown) => {
            const line = `[${new Date().toISOString()}] ${event}${data === undefined ? '' : ' ' + JSON.stringify(data)}\n`;
            process.stdout.write(line);
            await appendFile('../../sol-session.log', line).catch(() => {});
          };

          const session = await startSession({ host: 'rs-sdk-demo.fly.dev', username, password, quiet: false, profanityFilter: true });
          const client = session.client;
          const asClient = client as unknown as Client;
          const collector = new BotStateCollector(asClient);
          const executor = new ActionExecutor(asClient);
          executor.setScanProvider(collector);

          let tick = 0;
          let actions = 0;
          let nextActionTick = 0;
          let lastState: BotWorldState | null = null;
          let lastStyle = -1;
          let preferredWeaponChosen = false;
          let shieldAttempted = false;
          const talked = new Set<string>();
          const lessons = new Set<string>();

          const level = (s: BotWorldState, name: string) => s.skills.find(x => x.name.toLowerCase() === name.toLowerCase())?.level ?? 1;
          const act = (action: any, label: string, data: any = {}) => {
            const result = executor.execute(action);
            actions++;
            void log(label, { tick, ...data, result: result instanceof Promise ? 'async' : result });
            return result;
          };

          await log('SOL_AWAKE', { username, directive: 'survive, learn, avoid loops, expand capabilities' });

          client.setOnGameTickCallback(() => {
            tick++;
            try {
              const state = collector.collectState(tick, true) as BotWorldState | null;
              if (!state?.player) return;
              lastState = state;

              if (tick <= 3 || tick % 25 === 0) {
                void log('OBSERVE', {
                  tick,
                  pos: [state.player.worldX, state.player.worldZ, state.player.level],
                  hp: [state.player.hp, state.player.maxHp],
                  combatLevel: state.player.combatLevel,
                  skills: Object.fromEntries(state.skills.map(s => [s.name, s.level])),
                  inventory: state.inventory.map(i => i.name),
                  nearby: state.nearbyNpcs.slice(0, 10).map(n => ({ name: n.name, level: n.combatLevel, distance: n.distance, options: n.options }))
                });
              }

              if (state.dialog?.isOpen) {
                const option = state.dialog.options?.[0]?.index ?? 1;
                act({ type: 'clickDialogOption', optionIndex: option, reason: 'advance dialog' }, 'DIALOG', { options: state.dialog.options });
                nextActionTick = tick + 2;
                return;
              }
              if (state.interface?.isOpen) {
                act({ type: 'closeModal', reason: 'clear blocking modal' }, 'CLEAR_MODAL');
                nextActionTick = tick + 2;
                return;
              }
              if (tick < nextActionTick) return;

              // Survival.
              if (state.player.hp > 0 && state.player.hp <= Math.max(4, Math.floor(state.player.maxHp * 0.55))) {
                const food = state.inventory.find(i => i.optionsWithIndex.some(o => /^eat$/i.test(o.text)));
                const eat = food?.optionsWithIndex.find(o => /^eat$/i.test(o.text));
                if (food && eat) {
                  act({ type: 'useInventoryItem', slot: food.slot, optionIndex: eat.opIndex, reason: 'heal before more risk' }, 'SURVIVE_EAT', { item: food.name, hp: state.player.hp });
                  lessons.add('Heal before continuing when health becomes unsafe.');
                  nextActionTick = tick + 3;
                  return;
                }
                if (state.player.combat.inCombat) {
                  act({ type: 'walkTo', x: state.player.worldX + 7, z: state.player.worldZ + 7, running: true, reason: 'retreat without food' }, 'SURVIVE_RETREAT', { hp: state.player.hp });
                  nextActionTick = tick + 5;
                  return;
                }
              }

              // Pick one preferred starter weapon once; never ping-pong between alternatives.
              if (!preferredWeaponChosen) {
                const weapon = state.inventory.find(i => /bronze sword/i.test(i.name)) ?? state.inventory.find(i => /bronze dagger/i.test(i.name));
                const wield = weapon?.optionsWithIndex.find(o => /^wield$/i.test(o.text));
                if (weapon && wield) {
                  act({ type: 'useInventoryItem', slot: weapon.slot, optionIndex: wield.opIndex, reason: 'choose starter weapon once' }, 'EQUIP_WEAPON', { item: weapon.name });
                  preferredWeaponChosen = true;
                  lessons.add(`Selected ${weapon.name} as starter weapon instead of repeatedly swapping gear.`);
                  nextActionTick = tick + 3;
                  return;
                }
                preferredWeaponChosen = true;
              }
              if (!shieldAttempted) {
                const shield = state.inventory.find(i => /shield/i.test(i.name));
                const wield = shield?.optionsWithIndex.find(o => /^(wield|wear)$/i.test(o.text));
                shieldAttempted = true;
                if (shield && wield) {
                  act({ type: 'useInventoryItem', slot: shield.slot, optionIndex: wield.opIndex, reason: 'equip defensive gear once' }, 'EQUIP_SHIELD', { item: shield.name });
                  nextActionTick = tick + 3;
                  return;
                }
              }

              // Collect useful world output.
              const drop = state.groundItems.filter(g => g.reachable !== false && g.distance <= 8)
                .find(g => /coins|bones|rune|arrow|food|meat|sword|axe|shield/i.test(g.name));
              if (drop) {
                act({ type: 'pickupItem', x: drop.x, z: drop.z, itemId: drop.id, reason: 'collect useful resource' }, 'PICKUP', { item: drop.name, count: drop.count });
                lessons.add('Useful drops should be converted into inventory resources.');
                nextActionTick = tick + 4;
                return;
              }

              const bones = state.inventory.find(i => /bones/i.test(i.name) && i.optionsWithIndex.some(o => /bury/i.test(o.text)));
              const bury = bones?.optionsWithIndex.find(o => /bury/i.test(o.text));
              if (bones && bury && !state.player.combat.inCombat) {
                act({ type: 'useInventoryItem', slot: bones.slot, optionIndex: bury.opIndex, reason: 'convert bones to prayer progress' }, 'BURY', { item: bones.name });
                lessons.add('Bones can be converted into Prayer progress.');
                nextActionTick = tick + 3;
                return;
              }

              const atk = level(state, 'Attack');
              const str = level(state, 'Strength');
              const def = level(state, 'Defence');
              const thv = level(state, 'Thieving');
              const desiredSkill = atk < 6 ? 'Attack' : str < 6 ? 'Strength' : def < 6 ? 'Defence' : null;
              const combatStyle = (state as any).combatStyle;

              if (desiredSkill && combatStyle?.styles?.length) {
                const style = combatStyle.styles.find((s: any) => s.trainsSkills?.includes(desiredSkill));
                if (style && style.index !== lastStyle) {
                  act({ type: 'setCombatStyle', style: style.index, reason: `train ${desiredSkill}` }, 'COMBAT_STYLE', { desiredSkill, style: style.name });
                  lastStyle = style.index;
                  nextActionTick = tick + 2;
                  return;
                }
              }

              if (state.player.combat.inCombat) {
                nextActionTick = tick + 2;
                return;
              }

              if (desiredSkill && state.player.hp > 4) {
                const target = state.nearbyNpcs
                  .filter(n => n.reachable !== false && n.combatLevel <= Math.max(2, state.player.combatLevel))
                  .filter(n => /^(rat|chicken|goblin)$/i.test(n.name))
                  .filter(n => n.optionsWithIndex.some(o => /attack/i.test(o.text)))
                  .sort((a,b) => a.distance - b.distance)[0];
                const op = target?.optionsWithIndex.find(o => /attack/i.test(o.text));
                if (target && op) {
                  act({ type: 'interactNpc', npcIndex: target.index, optionIndex: op.opIndex, reason: `train ${desiredSkill}` }, 'COMBAT', { target: target.name, desiredSkill, levels: { atk, str, def } });
                  lessons.add('Low-level enemies provide controlled combat training.');
                  nextActionTick = tick + 7;
                  return;
                }
              }

              // Test Thieving after melee fundamentals.
              if (!desiredSkill && thv < 6 && state.player.hp > 6) {
                const mark = state.nearbyNpcs.filter(n => n.reachable !== false && /^(man|woman)$/i.test(n.name))
                  .find(n => n.optionsWithIndex.some(o => /pickpocket/i.test(o.text)));
                const op = mark?.optionsWithIndex.find(o => /pickpocket/i.test(o.text));
                if (mark && op) {
                  act({ type: 'interactNpc', npcIndex: mark.index, optionIndex: op.opIndex, reason: 'learn thieving economy' }, 'THIEVE', { target: mark.name, thieving: thv });
                  lessons.add('Thieving can generate progression and money but carries stun/HP risk.');
                  nextActionTick = tick + 8;
                  return;
                }
              }

              const interesting = state.nearbyNpcs
                .filter(n => n.reachable !== false && !talked.has(n.name))
                .find(n => !/^(man|woman|rat|chicken|goblin|butterfly|imp)$/i.test(n.name) && n.optionsWithIndex.some(o => /talk-to/i.test(o.text)));
              if (interesting) {
                const op = interesting.optionsWithIndex.find(o => /talk-to/i.test(o.text))!;
                talked.add(interesting.name);
                act({ type: 'interactNpc', npcIndex: interesting.index, optionIndex: op.opIndex, reason: 'discover services or quests once' }, 'DISCOVER_NPC', { npc: interesting.name });
                nextActionTick = tick + 6;
                return;
              }

              // Explore if no higher-priority action exists.
              if (tick % 10 === 0) {
                const offsets = [[6,0],[6,6],[0,6],[-6,6],[-6,0],[-6,-6],[0,-6],[6,-6]];
                const [dx,dz] = offsets[Math.floor(tick / 10) % offsets.length];
                act({ type: 'walkTo', x: state.player.worldX + dx, z: state.player.worldZ + dz, running: true, reason: 'explore for new opportunities' }, 'EXPLORE');
                nextActionTick = tick + 5;
              }
            } catch (err) {
              void log('TICK_ERROR', String(err));
            }
          });

          await Bun.sleep(RUN_MS);
          client.setOnGameTickCallback(null);
          await log('SOL_REFLECTION', { lessons: [...lessons] });
          await log('SOL_COMPLETE', {
            ticks: tick, actions,
            final: lastState ? {
              player: lastState.player,
              skills: Object.fromEntries(lastState.skills.map(s => [s.name, s.level])),
              inventory: lastState.inventory.map(i => ({ name: i.name, count: i.count }))
            } : null
          });
          session.stop();
          await session.stopped;
          EOF

      - name: Run Sol directly in the game
        working-directory: rs-sdk/server/webclient
        env:
          SOL_USER: Sol${{ github.run_number }}
          SOL_PASS: run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -o pipefail
          bun sol-lite.ts 2>&1 | tee ../../sol-console.log

      - name: Upload session logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-rs-sdk-session-${{ github.run_number }}
          path: |
            rs-sdk/sol-session.log
            rs-sdk/sol-console.log
          if-no-files-found: warn
