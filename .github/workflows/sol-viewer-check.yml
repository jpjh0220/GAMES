# compact-motor-v2 cadence verification
name: Verify Sol Live Viewer
on:
  push:
    paths:
      - '.github/workflows/sol-viewer-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Read current dual-AI endpoint
        id: endpoint
        run: |
          set -euo pipefail
          META=$(curl --fail --retry 5 --retry-delay 2 -sS -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/jpjh0220/GAMES/contents/sol-watch/live.json?ref=main&t=$(date +%s)")
          JSON=$(printf '%s' "$META" | jq -r .content | tr -d '\n' | base64 -d)
          test "$(printf '%s' "$JSON" | jq -r .controller)" = 'dual-ai-player-shadow-learner'
          test "$(printf '%s' "$JSON" | jq -r .motor)" = 'qwen3:0.6b'
          test "$(printf '%s' "$JSON" | jq -r .strategist)" = 'qwen3:1.7b'
          echo "url=$(printf '%s' "$JSON" | jq -r .url)" >> "$GITHUB_OUTPUT"
          echo "run=$(printf '%s' "$JSON" | jq -r .runNumber)" >> "$GITHUB_OUTPUT"

      - name: Verify AI motor controls Sol
        id: baseline
        env:
          LIVE_URL: ${{ steps.endpoint.outputs.url }}
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            STATE=$(curl --fail --connect-timeout 5 --max-time 10 -sS "$LIVE_URL/state" || true)
            if [ -n "$STATE" ] && echo "$STATE" | jq -e '
              .online == true and
              .agent.architecture == "dual-ai-player-shadow-learner" and
              .agent.motorOnline == true and
              .agent.motorModel == "qwen3:0.6b" and
              .agent.strategistModel == "qwen3:1.7b" and
              .agent.currentController == "ai-motor" and
              (.agent.lastChoice.source == "teacher") and
              (.agent.lifetime.teacherChoices >= 1) and
              (.agent.lifetime.completedExperiences >= 1) and
              (.agent.lastOutcome.reward|type == "number")
            ' >/dev/null; then
              echo "$STATE" | jq '{tick,actionCount,currentGoal,currentWhy,agent:{architecture:.agent.architecture,currentController:.agent.currentController,motorModel:.agent.motorModel,strategistModel:.agent.strategistModel,strategy:.agent.strategy,lastChoice:.agent.lastChoice,lastOutcome:.agent.lastOutcome,shadowStudentPrediction:.agent.shadowStudentPrediction,lifetime:.agent.lifetime}}'
              echo "actions=$(echo "$STATE" | jq -r .actionCount)" >> "$GITHUB_OUTPUT"
              echo "teacher=$(echo "$STATE" | jq -r .agent.lifetime.teacherChoices)" >> "$GITHUB_OUTPUT"
              echo "student=$(echo "$STATE" | jq -r .agent.lifetime.studentChoices)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 1
          done
          echo 'No completed AI-motor action/outcome observed.' >&2
          exit 1

      - name: Verify active AI cadence and shadow-only student
        env:
          LIVE_URL: ${{ steps.endpoint.outputs.url }}
          START_ACTIONS: ${{ steps.baseline.outputs.actions }}
          START_TEACHER: ${{ steps.baseline.outputs.teacher }}
          START_STUDENT: ${{ steps.baseline.outputs.student }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            sleep 1
            STATE=$(curl --fail --connect-timeout 5 --max-time 10 -sS "$LIVE_URL/state" || true)
            [ -n "$STATE" ] || continue
            ACTIONS=$(echo "$STATE" | jq -r .actionCount)
            TEACHER=$(echo "$STATE" | jq -r .agent.lifetime.teacherChoices)
            STUDENT=$(echo "$STATE" | jq -r .agent.lifetime.studentChoices)
            if [ "$ACTIONS" -ge $((START_ACTIONS+2)) ] && [ "$TEACHER" -ge $((START_TEACHER+2)) ] && [ "$STUDENT" -eq "$START_STUDENT" ]; then
              echo "$STATE" | jq '{tick,actionCount,currentGoal,currentWhy,agent:{currentController:.agent.currentController,lastChoice:.agent.lastChoice,lastOutcome:.agent.lastOutcome,strategy:.agent.strategy,lifetime:.agent.lifetime,shadowStudentPrediction:.agent.shadowStudentPrediction,shadowAgreementRate:.agent.shadowAgreementRate}}'
              echo 'Observed at least two additional AI actions within the cadence window; Sol student remained shadow-only.'
              exit 0
            fi
          done
          echo 'Dual AI did not produce two additional actions within 30 seconds, or executable student count changed.' >&2
          exit 1

      - name: Verify persistent Sol learning state
        run: |
          set -euo pipefail
          META=$(curl --fail -sS -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/jpjh0220/GAMES/contents/sol-agent/state.json?ref=sol-memory&t=$(date +%s)")
          STATE=$(printf '%s' "$META" | jq -r .content | tr -d '\n' | base64 -d)
          echo "$STATE" | jq -e '.version == 1 and (.lifetime.completedExperiences >= 1) and (.policy|type == "object") and (.places|type == "object")' >/dev/null
          echo "$STATE" | jq '{updatedAt,lifetime,policyContexts:(.policy|keys|length),memories:(.memories|length),places:(.places|keys|length)}'

      - name: Verify spectator remains intact
        env:
          LIVE_URL: ${{ steps.endpoint.outputs.url }}
        run: |
          set -euo pipefail
          STATE=$(curl --fail --connect-timeout 5 --max-time 15 -sS "$LIVE_URL/state")
          echo "$STATE" | jq -e '.online == true and (.movementTrail|type == "array") and (.nearbyPlayers|type == "array") and (.nearbyNpcs|type == "array") and (.agent|type == "object")' >/dev/null
          curl --fail --connect-timeout 5 --max-time 15 -sS "$LIVE_URL/" -o /tmp/sol-viewer.html
          grep -q 'SOL // WORLD SPECTATOR' /tmp/sol-viewer.html
