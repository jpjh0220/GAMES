name: Verify Sol Live Viewer
on:
  push:
    paths:
      - '.github/workflows/sol-viewer-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Read current live endpoint
        id: endpoint
        run: |
          set -euo pipefail
          JSON=$(curl --fail --retry 5 --retry-delay 2 -sS "https://raw.githubusercontent.com/jpjh0220/GAMES/main/sol-watch/live.json?$(date +%s)")
          URL=$(printf '%s' "$JSON" | jq -r .url)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Current endpoint: $URL"
      - name: Verify telemetry health
        env:
          LIVE_URL: ${{ steps.endpoint.outputs.url }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if HEALTH=$(curl --fail --connect-timeout 5 --max-time 10 -sS "$LIVE_URL/health"); then
              echo "$HEALTH"
              echo "$HEALTH" | jq -e '.ok == true' >/dev/null
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify dashboard
        env:
          LIVE_URL: ${{ steps.endpoint.outputs.url }}
        run: |
          set -euo pipefail
          HTML=$(curl --fail --connect-timeout 5 --max-time 15 -sS "$LIVE_URL/")
          printf '%s' "$HTML" | grep -q 'SOL // LIVE WORLD OBSERVER'
          echo 'Dashboard HTML verified.'
