name: Verify Sol Live Viewer
on:
  push:
    paths:
      - '.github/workflows/sol-viewer-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Read current live endpoint
        id: endpoint
        run: |
          set -euo pipefail
          JSON=$(curl --fail --retry 5 --retry-delay 2 -sS "https://raw.githubusercontent.com/jpjh0220/GAMES/main/sol-watch/live.json?$(date +%s)")
          URL=$(printf '%s' "$JSON" | jq -r .url)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Endpoint acquired."
      - name: Verify telemetry health
        env:
          LIVE_URL: ${{ steps.endpoint.outputs.url }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if HEALTH=$(curl --fail --connect-timeout 5 --max-time 10 -sS "$LIVE_URL/health"); then
              echo "$HEALTH"
              echo "$HEALTH" | jq -e '.ok == true and .online == true and (.actionCount|type == "number") and (.sessionStartedAt|type == "string")' >/dev/null
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify live world state
        env:
          LIVE_URL: ${{ steps.endpoint.outputs.url }}
        run: |
          set -euo pipefail
          STATE=$(curl --fail --connect-timeout 5 --max-time 15 -sS "$LIVE_URL/state")
          echo "$STATE" | jq -e '.online == true and (.currentGoal|type == "string") and (.currentWhy|type == "string") and (.movementTrail|type == "array") and (.nearbyPlayers|type == "array") and (.nearbyNpcs|type == "array") and (.nearbyLocs|type == "array") and (.combatStyle|type == "object")' >/dev/null
          echo 'Live world telemetry verified.'
      - name: Verify cinematic spectator UI
        env:
          LIVE_URL: ${{ steps.endpoint.outputs.url }}
        run: |
          set -euo pipefail
          HTML=$(curl --fail --connect-timeout 5 --max-time 15 -sS "$LIVE_URL/")
          printf '%s' "$HTML" | grep -q 'SOL // WORLD SPECTATOR'
          printf '%s' "$HTML" | grep -q 'Live isometric view'
          printf '%s' "$HTML" | grep -q 'Current objective'
          printf '%s' "$HTML" | grep -q 'Decision timeline'
          printf '%s' "$HTML" | grep -q 'minimap'
          echo 'Cinematic spectator UI verified.'
