name: Sol Viewer Handoff Now
on:
  push:
    paths:
      - '.github/workflows/sol-handoff-now.yml'
permissions:
  actions: write
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel legacy Sol runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/31758192744/cancel
